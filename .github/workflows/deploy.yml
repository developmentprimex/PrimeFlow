      - name: Prepare isolated Mira release
        if: ${{ steps.changes.outputs.mira_restart == 'true' }}
        shell: powershell
        working-directory: backend
        run: |
          & 'C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe' -m scripts.deploy_mira_release prepare
          if ($LASTEXITCODE -ne 0) { throw 'Mira preparation failed. The running bot was not stopped.' }

      - name: Prepare Backend
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: cmd
        env:
          MCP_ASSISTANT_ENABLED: ${{ vars.MCP_ASSISTANT_ENABLED || 'false' }}
          INSTALL_BACKEND_REQUIREMENTS: ${{ vars.INSTALL_BACKEND_REQUIREMENTS || 'false' }}
          MIRA_RESTART: ${{ steps.changes.outputs.mira_restart }}
        run: |
          cd backend
          REM The API's own pinned dependencies were never installed by this workflow.
          REM Off by default; set the Actions variable INSTALL_BACKEND_REQUIREMENTS=true to enable it.
          if /I "%INSTALL_BACKEND_REQUIREMENTS%"=="true" (
            "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m pip install -r requirements.txt
            if errorlevel 1 exit /b 1
          )
          REM The GA assistant MCP needs a newer MCP SDK; it lives in its own virtualenv
          REM so primeflow-mcp (8010) keeps the mcp version from requirements.txt.
          if /I "%MCP_ASSISTANT_ENABLED%"=="true" (
            if not exist .venv-mcp-assistant\Scripts\python.exe "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m venv .venv-mcp-assistant
            if errorlevel 1 exit /b 1
            .venv-mcp-assistant\Scripts\python.exe -m pip install -r requirements-mcp-assistant.txt
            if errorlevel 1 exit /b 1
            .venv-mcp-assistant\Scripts\python.exe -m unittest tests.test_mcp_assistant_profile
            if errorlevel 1 exit /b 1
          )
          if /I "%MIRA_RESTART%"=="true" (
            "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m pip install -r requirements-discord.txt
            if errorlevel 1 exit /b 1
