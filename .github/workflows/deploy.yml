name: Primex Auto Deploy
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: read

# The same Windows workspace serves traffic and must never be synced by two jobs.
concurrency:
  group: primeflow-production-deploy
  cancel-in-progress: false

jobs:
  plan:
    outputs:
      backend: ${{ steps.changes.outputs.backend_changed }}
      mira_restart: ${{ steps.changes.outputs.mira_restart }}
      frontend: ${{ steps.changes.outputs.frontend_changed }}
      runner: ${{ steps.changes.outputs.runner }}
    runs-on: self-hosted
    env:
      PM2_HOME: C:\pm2-system
      # PM2 services must outlive this self-hosted Actions job. Without clearing
      # the runner marker, GitHub kills them as orphan processes during cleanup.
      RUNNER_TRACKING_ID: ""
    steps:
      - name: Checkout Code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          if (-not $env:GH_TOKEN -or $env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "A checkout token and a valid deployment commit are required."
          }

          # Live PM2 processes use this workspace as their working directory.
          # actions/checkout can delete it even with clean:false when .git is
          # missing or origin differs. Sync tracked files in place instead.
          function Invoke-DeployGit {
            param([string[]]$GitArguments)
            & git -c "http.$env:GITHUB_SERVER_URL/.extraheader=" --config-env="http.$env:GITHUB_SERVER_URL/.extraheader=GIT_AUTH_HEADER" -c "credential.helper=" @GitArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Deployment git command failed: $($GitArguments[0]) (exit $LASTEXITCODE)."
            }
          }

          # Keep authentication in this step's environment, never in .git/config.
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Host "::add-mask::$credential"
          $env:GIT_TERMINAL_PROMPT = "0"
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "safe.directory"
          $env:GIT_CONFIG_VALUE_0 = $env:GITHUB_WORKSPACE
          $env:GIT_AUTH_HEADER = "AUTHORIZATION: basic $credential"
          try {
            Invoke-DeployGit -GitArguments @("init", ".")
            $remotes = @(Invoke-DeployGit -GitArguments @("remote"))
            if ($remotes -contains "origin") {
              Invoke-DeployGit -GitArguments @("remote", "set-url", "origin", $repositoryUrl)
            } else {
              Invoke-DeployGit -GitArguments @("remote", "add", "origin", $repositoryUrl)
            }
            $fetchArguments = @("fetch", "--force", "--tags", "--no-recurse-submodules")
            $shallow = Invoke-DeployGit -GitArguments @("rev-parse", "--is-shallow-repository")
            if ($shallow -eq "true") { $fetchArguments += "--unshallow" }
            $fetchArguments += @("origin", "+refs/heads/main:refs/remotes/origin/main", $env:GITHUB_SHA)
            Invoke-DeployGit -GitArguments $fetchArguments
            # Deploy the event's commit even if main has moved since this job queued.
            Invoke-DeployGit -GitArguments @("checkout", "--force", "--detach", $env:GITHUB_SHA)
            $actual = Invoke-DeployGit -GitArguments @("rev-parse", "HEAD")
            if ($actual -ne $env:GITHUB_SHA) { throw "Checkout commit differs from deployment commit." }
            Write-Host "Deployment checkout ready: $actual"
          } finally {
            Remove-Item Env:GH_TOKEN, Env:GIT_TERMINAL_PROMPT, Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0, Env:GIT_AUTH_HEADER -ErrorAction SilentlyContinue
          }
 
      - name: Configure Server Tooling
        shell: powershell
        run: |
          "C:\npm-global" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
 
      - name: Force Sync with GitHub
        shell: cmd
        run: |
          REM Checkout Code already fetched and selected the exact deployment SHA.
          REM The self-hosted runner keeps ignored deployment state, but stale
          REM untracked migration files must never participate in Alembic's graph.
          git clean -f -- backend/alembic/versions
          if errorlevel 1 exit /b 1
          git status --short -- backend/alembic/versions
          if errorlevel 1 exit /b 1
 
      - name: Detect Changed Files
        id: changes
        shell: powershell
        run: |
          # Each surface records the commit it last deployed successfully. A
          # surface is redeployed only when its own files differ from that
          # commit, so a backend push no longer rebuilds and restarts the
          # frontend, and a failed deploy is retried by the next push because
          # its marker was never advanced.
          $stateDir = Join-Path $env:PM2_HOME "primeflow-deploy"
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $after = "${{ github.sha }}"

          function Test-SurfaceChanged {
            param([string]$Name, [string]$PathPrefix)

            $marker = Join-Path $stateDir "$Name.sha"
            if (-not (Test-Path $marker)) {
              Write-Host "${Name}: no deploy marker yet; deploying."
              return $true
            }
            $deployed = (Get-Content $marker -Raw).Trim()
            git rev-parse --verify --quiet "$($deployed)^{commit}" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "${Name}: marker commit '$deployed' is unknown; deploying."
              return $true
            }
            $files = @(git diff --name-only $deployed $after | Where-Object { $_ -and $_.Trim() -ne "" })
            $relevant = @($files | Where-Object { $_ -like "$PathPrefix/*" -or $_ -like "deploy/*" -or $_ -eq ".github/workflows/deploy.yml" -or ($Name -eq "frontend" -and $_ -eq ".github/workflows/prepare-frontend.yml") })
            Write-Host "${Name}: last deployed $deployed, $($relevant.Count) relevant changed file(s)."
            $relevant | ForEach-Object { Write-Host " - $_" }
            return ($relevant.Count -gt 0)
          }

          $backendChanged = Test-SurfaceChanged -Name "backend" -PathPrefix "backend"
          # Re-running manually must apply changed Discord secrets/settings too.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $backendChanged = $true }
          $miraRestart = $backendChanged
          $backendMarker = Join-Path $stateDir 'backend.sha'
          if ($backendChanged -and "${{ github.event_name }}" -ne 'workflow_dispatch' -and
              '${{ vars.INSTALL_BACKEND_REQUIREMENTS }}' -ne 'true' -and (Test-Path -LiteralPath $backendMarker)) {
            $deployed = (Get-Content -LiteralPath $backendMarker -Raw).Trim()
            $changed = @(git diff --name-only --no-renames $deployed $after)
            if ($LASTEXITCODE -eq 0) {
              $serverOnly = '^(backend/app/(api/routers/(common_view|exports|ga_notes|mira|tasks)\.py$|jobs/|services/mira_voice_dictation\.py$)|backend/tests/)'
              $shared = @($changed | Where-Object {
                ($_ -like 'backend/*' -or $_ -like 'deploy/*' -or $_ -eq '.github/workflows/deploy.yml') -and $_ -notmatch $serverOnly
              })
              if ($shared.Count -eq 0) {
                try {
                  $processJson = @(cmd /d /c 'pm2.cmd jlist')
                  if ($LASTEXITCODE -ne 0) { throw 'Could not read PM2 state' }
                  $processes = $processJson -join "`n" | ConvertFrom-Json -ErrorAction Stop
                  $primary = $processes | Where-Object { $_.name -eq 'primeflow-discord' }
                  $agent = $processes | Where-Object { $_.name -eq 'primeflow-discord-ai-agent' }
                  $gateway = 'http://127.0.0.1:18080'
                  $primaryStatus = Get-Content -LiteralPath (Join-Path $primary.pm2_env.pm_cwd '.discord-worker-status.json') -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                  $workerPid = [int]$primaryStatus.pid
                  $primaryPid = [int]$primary.pid
                  $primaryOwnsWorker = $workerPid -gt 0 -and $primaryPid -gt 0 -and ($workerPid -eq $primaryPid -or
                    (Get-CimInstance Win32_Process -Filter "ProcessId = $workerPid" -ErrorAction Stop).ParentProcessId -eq $primaryPid)
                  $agentReady = -not (Test-Path -LiteralPath 'C:\PrimeFlowOps\MiraAIAgent\.env') -or
                    ($agent.pm2_env.status -eq 'online' -and $agent.pm2_env.PRIMEFLOW_API_BASE_URL -eq $gateway)
                  $miraRestart = -not ($primary.pm2_env.status -eq 'online' -and
                    $primary.pm2_env.PRIMEFLOW_API_BASE_URL -eq $gateway -and $primaryOwnsWorker -and $agentReady)
                } catch {
                  Write-Host 'Mira readiness could not be verified. Using the guarded restart.'
                }
              }
            }
          }
          Write-Host "Mira restart required: $miraRestart"
          $frontendChanged = Test-SurfaceChanged -Name "frontend" -PathPrefix "frontend"
          # A reboot or a lost PM2 daemon leaves the frontend stopped while its
          # marker still says "deployed"; redeploy it instead of skipping.
          if (-not $frontendChanged -and -not (Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue)) {
            Write-Host "frontend: nothing is listening on port 3000; deploying."
            $frontendChanged = $true
          }

          "runner=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "backend_changed=$($backendChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mira_restart=$($miraRestart.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "frontend_changed=$($frontendChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # A failed marker lookup above must not fail the step.
          exit 0
 
  build_frontend:
    needs: plan
    if: ${{ needs.plan.outputs.frontend == 'true' }}
    uses: ./.github/workflows/prepare-frontend.yml
    with:
      publish_artifact: true

  deploy:
    needs: [plan, build_frontend]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build_frontend.result == 'success' || needs.build_frontend.result == 'skipped') }}
    runs-on: self-hosted
    env:
      PM2_HOME: C:\pm2-system
      RUNNER_TRACKING_ID: ""
    steps:
      - name: Verify planned checkout
        id: changes
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne '${{ needs.plan.outputs.runner }}' -or (git rev-parse HEAD) -ne $env:GITHUB_SHA) {
            throw 'Production checkout differs from the release plan.'
          }
          "C:\npm-global" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "backend_changed=${{ needs.plan.outputs.backend }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mira_restart=${{ needs.plan.outputs.mira_restart }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "frontend_changed=${{ needs.plan.outputs.frontend }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download verified frontend package
        uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.frontend == 'true' }}
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Verify public deployment gateways
        if: ${{ steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./deploy/origins.ps1
          foreach ($surface in @('web','api')) {
            $route = Get-PrimeFlowRoute $surface
            Test-PrimeFlowOrigin $surface $route.port -Public
          }

      - name: Notify Discord before deployment
        id: discord_notice
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          $state = Join-Path $env:RUNNER_TEMP "primeflow-discord-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          & "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" backend/scripts/notify_discord_deploy.py --phase start --state-file $state
          if ($LASTEXITCODE -ne 0) { throw "Some Discord deployment notices could not be delivered; see warnings." }

      - name: Preserve legacy Mira configuration
        if: ${{ steps.changes.outputs.mira_restart == 'true' }}
        shell: powershell
        working-directory: backend
        run: |
          & 'C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe' -m scripts.deploy_mira_release snapshot
          if ($LASTEXITCODE -ne 0) { throw 'Could not preserve the previous Mira configuration.' }

      - name: Create Env Files
        shell: cmd
        env:
          PRIMEFLOW_MCP_EMAIL: ${{ secrets.PRIMEFLOW_MCP_EMAIL }}
          PRIMEFLOW_MCP_PASSWORD: ${{ secrets.PRIMEFLOW_MCP_PASSWORD }}
          PRIMEFLOW_READONLY_DATABASE_URL: ${{ secrets.PRIMEFLOW_READONLY_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_STORAGE_DIR: ${{ vars.REPORT_STORAGE_DIR }}
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID || secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_MAIL_CLIENT_ID: ${{ vars.MS_MAIL_CLIENT_ID }}
          MS_MAIL_TENANT_ID: ${{ vars.MS_MAIL_TENANT_ID }}
          MS_MAIL_CLIENT_SECRET: ${{ secrets.MS_MAIL_CLIENT_SECRET }}
          MS_MAIL_SIGNING_KEY: ${{ secrets.MS_MAIL_SIGNING_KEY }}
          MS_MAIL_IT_CLIENT_ID: ${{ vars.MS_MAIL_IT_CLIENT_ID }}
          MS_MAIL_IT_TENANT_ID: ${{ vars.MS_MAIL_IT_TENANT_ID }}
          MS_MAIL_IT_CLIENT_SECRET: ${{ secrets.MS_MAIL_IT_CLIENT_SECRET }}
          GMAIL_PX_EU_CLIENT_ID: ${{ vars.GMAIL_PX_EU_CLIENT_ID }}
          GMAIL_PX_EU_CLIENT_SECRET: ${{ secrets.GMAIL_PX_EU_CLIENT_SECRET }}
          HOMEFACE_MAIL_APP_PASSWORD: ${{ secrets.HOMEFACE_MAIL_APP_PASSWORD }}
          GA_PERSONAL_DISCORD_BRIDGE_SECRET: ${{ secrets.GA_PERSONAL_DISCORD_BRIDGE_SECRET }}
          MCP_ASSISTANT_ENABLED: ${{ vars.MCP_ASSISTANT_ENABLED || 'false' }}
          MCP_ASSISTANT_ALLOWED_EMAILS: ${{ vars.MCP_ASSISTANT_ALLOWED_EMAILS }}
          MCP_ASSISTANT_INTERNAL_SECRET: ${{ secrets.MCP_ASSISTANT_INTERNAL_SECRET }}
          MS_TODO_ENABLED: ${{ vars.MS_TODO_ENABLED || 'false' }}
          GA_DISCORD_MENTIONS_BOT_TOKEN: ${{ secrets.GA_DISCORD_MENTIONS_BOT_TOKEN }}
        run: |
          if not defined MS_CLIENT_ID (echo ::error::MS_CLIENT_ID is missing from GitHub Actions Variables or Secrets & exit /b 1)
          if not defined MS_TENANT_ID (echo ::error::MS_TENANT_ID is missing from GitHub Actions Variables or Secrets & exit /b 1)
          if not defined MS_CLIENT_SECRET (echo ::error::MS_CLIENT_SECRET is missing from GitHub Actions Secrets & exit /b 1)
          if not defined EMAIL_USER (echo ::error::EMAIL_USER is missing from GitHub Actions Secrets & exit /b 1)
          if not defined EMAIL_PASSWORD (echo ::error::EMAIL_PASSWORD is missing from GitHub Actions Secrets & exit /b 1)
          echo NEXT_PUBLIC_API_BASE_URL=https://api-flow.primexeu.com > frontend\.env.local
          echo DATABASE_URL=postgresql+asyncpg://postgres:12345678@localhost:5433/primex_nexus > backend\.env
          echo DB_POOL_SIZE=20 >> backend\.env
          echo DB_MAX_OVERFLOW=20 >> backend\.env
          echo DB_POOL_TIMEOUT=30 >> backend\.env
          echo DB_POOL_RECYCLE=1800 >> backend\.env
          echo MEETING_RECORDINGS_ROOT=C:/PrimeFlowData/MeetingRecordings >> backend\.env
          echo RECORDING_TIMING_ENABLED=true >> backend\.env
          echo RECORDING_TIMING_PYTHON=D:/PrimeFlow-alignment-pilot/venv/Scripts/python.exe >> backend\.env
          echo RECORDING_TIMING_MODEL_CACHE=D:/PrimeFlow-alignment-pilot/model-cache >> backend\.env
          echo MEETING_RECORDINGS_FFMPEG=D:/PrimeFlow-alignment-pilot/bin/ffmpeg.exe >> backend\.env
          echo MEETING_RECORDINGS_FFPROBE=D:/PrimeFlow-alignment-pilot/bin/ffprobe.exe >> backend\.env
          echo JWT_SECRET=primex_nexus_secret_key_2026 >> backend\.env
          echo REDIS_ENABLED=true >> backend\.env
          echo REDIS_URL=redis://127.0.0.1:6379/0 >> backend\.env
          echo APP_TIMEZONE=Europe/Budapest >> backend\.env
          REM Read the optional family bridge key from the environment, never
          REM interpolate its value into a shell command or print it in logs.
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -c "import os,re; from pathlib import Path; key=os.environ.get('GA_PERSONAL_DISCORD_BRIDGE_SECRET','').strip(); assert not key or re.fullmatch(r'[A-Za-z0-9_-]{32,128}',key), 'Invalid GA PERSONAL bridge key; use the generated URL-safe key'; Path('backend/.env').open('a',encoding='utf-8').write('GA_PERSONAL_ENABLED=true\n'+('GA_PERSONAL_DISCORD_BRIDGE_SECRET='+key+'\n' if key else ''))"
          if errorlevel 1 exit /b 1
          echo CORS_ORIGINS=https://primeflow.primexeu.com,https://api-flow.primexeu.com >> backend\.env
          echo FRONTEND_URL=https://primeflow.primexeu.com >> backend\.env
          echo MS_CLIENT_ID=%MS_CLIENT_ID% >> backend\.env
          echo MS_TENANT_ID=%MS_TENANT_ID% >> backend\.env
          echo MS_CLIENT_SECRET=%MS_CLIENT_SECRET% >> backend\.env
          echo MS_REDIRECT_URI=https://api-flow.primexeu.com/api/microsoft/callback >> backend\.env
          echo MS_ORGANIZER_EMAIL=info@primexeu.com >> backend\.env
          REM Pass optional mail settings by environment so secrets are not interpolated into cmd.
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -c "import json,os; from pathlib import Path; names=('MS_MAIL_CLIENT_ID','MS_MAIL_TENANT_ID','MS_MAIL_CLIENT_SECRET','MS_MAIL_SIGNING_KEY','MS_MAIL_IT_CLIENT_ID','MS_MAIL_IT_TENANT_ID','MS_MAIL_IT_CLIENT_SECRET','GMAIL_PX_EU_CLIENT_ID','GMAIL_PX_EU_CLIENT_SECRET','HOMEFACE_MAIL_APP_PASSWORD'); settings={name:os.environ.get(name,'') for name in names}; settings['MS_MAIL_REDIRECT_URI']='https://api-flow.primexeu.com/api/microsoft-mail/callback'; settings['GMAIL_PX_EU_REDIRECT_URI']='https://api-flow.primexeu.com/api/gmail-mail/callback'; Path('backend/.env').open('a',encoding='utf-8').writelines(f'{name}={json.dumps(value)}\n' for name,value in settings.items() if value)"
          if errorlevel 1 exit /b 1
          echo MS_CALENDAR_SYNC_PAST_DAYS=0 >> backend\.env
          echo MS_CALENDAR_SYNC_FUTURE_DAYS=14 >> backend\.env
          echo DEVELOPMENT_CLIENTS_PATH=\\192.168.10.8\Files\10_ZHVILLIM\05_CLIENTS >> backend\.env
          echo PRODUCT_CLIENTS_PATH=\\192.168.10.8\Klientat\05_CLIENTS >> backend\.env
          echo PRIMEFLOW_API_BASE_URL=https://api-flow.primexeu.com >> backend\.env
          echo PRIMEFLOW_WEB_BASE_URL=https://primeflow.primexeu.com >> backend\.env
          echo PRIMEFLOW_MCP_TRANSPORT=sse >> backend\.env
          echo PRIMEFLOW_MCP_HOST=127.0.0.1 >> backend\.env
          echo PRIMEFLOW_MCP_PORT=8010 >> backend\.env
          echo PRIMEFLOW_EMAIL=%PRIMEFLOW_MCP_EMAIL% >> backend\.env
          echo PRIMEFLOW_PASSWORD=%PRIMEFLOW_MCP_PASSWORD% >> backend\.env
          echo PRIMEFLOW_READONLY_DATABASE_URL=%PRIMEFLOW_READONLY_DATABASE_URL% >> backend\.env
          echo PRIMEFLOW_REPORT_TIMEZONE=Europe/Tirane >> backend\.env
          echo PRIMEFLOW_REPORT_RECIPIENTS=130primex.eu@gmail.com,ga@primexeu.com >> backend\.env
          echo EMAIL_HOST=smtp.gmail.com >> backend\.env
          echo EMAIL_PORT=587 >> backend\.env
          echo EMAIL_USER=%EMAIL_USER% >> backend\.env
          echo EMAIL_PASSWORD=%EMAIL_PASSWORD% >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_ENABLED=true >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_TIMEZONE=Europe/Tirane >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_RECIPIENTS=130primex.eu@gmail.com,info@primexeu.com,ga@primexeu.com >> backend\.env
          echo REPORT_STORAGE_DIR=%REPORT_STORAGE_DIR% >> backend\.env
          echo REPORT_RETENTION_DAYS=90 >> backend\.env
          echo OPENAI_API_KEY=%OPENAI_API_KEY% >> backend\.env
          echo SKILLS_AI_MODEL=gpt-5.4-nano >> backend\.env
          echo SKILLS_AI_TIMEOUT_SECONDS=20 >> backend\.env
          echo REALIZATION_AI_ENABLED=true >> backend\.env
          echo REALIZATION_AI_MODEL=gpt-5.2 >> backend\.env
          echo REALIZATION_AI_TIMEOUT_SECONDS=45 >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_ENABLED=true >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_MODEL=gpt-5.2 >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_TIMEOUT_SECONDS=90 >> backend\.env
          REM GA assistant MCP connector (OAuth server + primeflow-mcp-assistant on 8011).
          echo MCP_ASSISTANT_ENABLED=%MCP_ASSISTANT_ENABLED% >> backend\.env
          echo MCP_ASSISTANT_ALLOWED_EMAILS=%MCP_ASSISTANT_ALLOWED_EMAILS% >> backend\.env
          echo MCP_ASSISTANT_INTERNAL_SECRET=%MCP_ASSISTANT_INTERNAL_SECRET% >> backend\.env
          echo MCP_ASSISTANT_RESOURCE_URL=https://mcp-flow.primexeu.com/mcp >> backend\.env
          echo OAUTH_ISSUER_URL=https://api-flow.primexeu.com >> backend\.env
          echo GA_TIMEZONE=Europe/Belgrade >> backend\.env
          echo MS_TODO_ENABLED=%MS_TODO_ENABLED% >> backend\.env
          REM Read-only GA Discord mentions bot. backend\.env is rebuilt on every deploy, so the token comes from Actions.
          if defined GA_DISCORD_MENTIONS_BOT_TOKEN echo GA_DISCORD_MENTIONS_BOT_TOKEN=%GA_DISCORD_MENTIONS_BOT_TOKEN%>> backend\.env
 
      - name: Configure Discord Assistant
        shell: powershell
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BRIDGE_SECRET: ${{ secrets.DISCORD_BRIDGE_SECRET }}
          DISCORD_ASSISTANT_ENABLED: ${{ vars.DISCORD_ASSISTANT_ENABLED }}
          DISCORD_CATEGORY_ID: ${{ vars.DISCORD_CATEGORY_ID }}
          DISCORD_MEETING_VOICE_CHANNEL_ID: ${{ vars.DISCORD_MEETING_VOICE_CHANNEL_ID }}
          DISCORD_MESSAGE_CONTENT_ENABLED: ${{ vars.DISCORD_MESSAGE_CONTENT_ENABLED }}
          DISCORD_AI_MODEL: ${{ vars.DISCORD_AI_MODEL }}
          DISCORD_AGENT_MODEL: ${{ vars.DISCORD_AGENT_MODEL }}
          DISCORD_MEETING_NOTES_ENABLED: ${{ vars.DISCORD_MEETING_NOTES_ENABLED }}
          DISCORD_VOICE_NODE_BINARY: ${{ vars.DISCORD_VOICE_NODE_BINARY }}
          MIRA_MEMORY_ENABLED: ${{ vars.MIRA_MEMORY_ENABLED }}
          MIRA_HOST_ENABLED: ${{ vars.MIRA_HOST_ENABLED }}
          MIRA_HOST_BOT_TOKEN: ${{ secrets.MIRA_HOST_BOT_TOKEN }}
          MIRA_NOTES_OPENAI_API_KEY: ${{ secrets.MIRA_NOTES_OPENAI_API_KEY }}
          MIRA_HOST_OPENAI_API_KEY: ${{ secrets.MIRA_HOST_OPENAI_API_KEY }}
          KUJTESA_OPENAI_API_KEY: ${{ secrets.KUJTESA_OPENAI_API_KEY }}
          KUJTESA_HOST_ENABLED: ${{ vars.KUJTESA_HOST_ENABLED }}
          KUJTESA_HOST_MODEL: ${{ vars.KUJTESA_HOST_MODEL }}
          KUJTESA_HOST_VOICE: ${{ vars.KUJTESA_HOST_VOICE }}
          GA_PERSONAL_ENABLED: ${{ vars.GA_PERSONAL_ENABLED || 'true' }}
          GA_PERSONAL_DISCORD_BRIDGE_SECRET: ${{ secrets.GA_PERSONAL_DISCORD_BRIDGE_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" backend/scripts/configure_discord.py
          if ($LASTEXITCODE -ne 0) { throw "Discord configuration failed. Check the required Actions secrets." }

      - name: Configure Kujtesa Server
        if: ${{ vars.KUJTESA_EXTERNAL_MANAGED != 'true' }}
        shell: powershell
        env:
