name: Primex Auto Deploy
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: read

# The same Windows workspace serves traffic and must never be synced by two jobs.
concurrency:
  group: primeflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      PM2_HOME: C:\pm2-system
      # PM2 services must outlive this self-hosted Actions job. Without clearing
      # the runner marker, GitHub kills them as orphan processes during cleanup.
      RUNNER_TRACKING_ID: ""
    steps:
      - name: Checkout Code
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          if (-not $env:GH_TOKEN -or $env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "A checkout token and a valid deployment commit are required."
          }

          # Live PM2 processes use this workspace as their working directory.
          # actions/checkout can delete it even with clean:false when .git is
          # missing or origin differs. Sync tracked files in place instead.
          function Invoke-DeployGit {
            param([string[]]$GitArguments)
            & git -c "http.$env:GITHUB_SERVER_URL/.extraheader=" --config-env="http.$env:GITHUB_SERVER_URL/.extraheader=GIT_AUTH_HEADER" -c "credential.helper=" @GitArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Deployment git command failed: $($GitArguments[0]) (exit $LASTEXITCODE)."
            }
          }

          # Keep authentication in this step's environment, never in .git/config.
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          Write-Host "::add-mask::$credential"
          $env:GIT_TERMINAL_PROMPT = "0"
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "safe.directory"
          $env:GIT_CONFIG_VALUE_0 = $env:GITHUB_WORKSPACE
          $env:GIT_AUTH_HEADER = "AUTHORIZATION: basic $credential"
          try {
            Invoke-DeployGit -GitArguments @("init", ".")
            $remotes = @(Invoke-DeployGit -GitArguments @("remote"))
            if ($remotes -contains "origin") {
              Invoke-DeployGit -GitArguments @("remote", "set-url", "origin", $repositoryUrl)
            } else {
              Invoke-DeployGit -GitArguments @("remote", "add", "origin", $repositoryUrl)
            }
            $fetchArguments = @("fetch", "--force", "--tags", "--no-recurse-submodules")
            $shallow = Invoke-DeployGit -GitArguments @("rev-parse", "--is-shallow-repository")
            if ($shallow -eq "true") { $fetchArguments += "--unshallow" }
            $fetchArguments += @("origin", "+refs/heads/main:refs/remotes/origin/main", $env:GITHUB_SHA)
            Invoke-DeployGit -GitArguments $fetchArguments
            # Deploy the event's commit even if main has moved since this job queued.
            Invoke-DeployGit -GitArguments @("checkout", "--force", "--detach", $env:GITHUB_SHA)
            $actual = Invoke-DeployGit -GitArguments @("rev-parse", "HEAD")
            if ($actual -ne $env:GITHUB_SHA) { throw "Checkout commit differs from deployment commit." }
            Write-Host "Deployment checkout ready: $actual"
          } finally {
            Remove-Item Env:GH_TOKEN, Env:GIT_TERMINAL_PROMPT, Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0, Env:GIT_AUTH_HEADER -ErrorAction SilentlyContinue
          }
 
      - name: Configure Server Tooling
        shell: powershell
        run: |
          "C:\npm-global" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
 
      - name: Force Sync with GitHub
        shell: cmd
        run: |
          REM Checkout Code already fetched and selected the exact deployment SHA.
          REM The self-hosted runner keeps ignored deployment state, but stale
          REM untracked migration files must never participate in Alembic's graph.
          git clean -f -- backend/alembic/versions
          if errorlevel 1 exit /b 1
          git status --short -- backend/alembic/versions
          if errorlevel 1 exit /b 1
 
      - name: Detect Changed Files
        id: changes
        shell: powershell
        run: |
          # Each surface records the commit it last deployed successfully. A
          # surface is redeployed only when its own files differ from that
          # commit, so a backend push no longer rebuilds and restarts the
          # frontend, and a failed deploy is retried by the next push because
          # its marker was never advanced.
          $stateDir = Join-Path $env:PM2_HOME "primeflow-deploy"
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $after = "${{ github.sha }}"

          function Test-SurfaceChanged {
            param([string]$Name, [string]$PathPrefix)

            $marker = Join-Path $stateDir "$Name.sha"
            if (-not (Test-Path $marker)) {
              Write-Host "${Name}: no deploy marker yet; deploying."
              return $true
            }
            $deployed = (Get-Content $marker -Raw).Trim()
            git rev-parse --verify --quiet "$($deployed)^{commit}" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "${Name}: marker commit '$deployed' is unknown; deploying."
              return $true
            }
            $files = @(git diff --name-only $deployed $after | Where-Object { $_ -and $_.Trim() -ne "" })
            $relevant = @($files | Where-Object { $_ -like "$PathPrefix/*" -or $_ -eq ".github/workflows/deploy.yml" })
            Write-Host "${Name}: last deployed $deployed, $($relevant.Count) relevant changed file(s)."
            $relevant | ForEach-Object { Write-Host " - $_" }
            return ($relevant.Count -gt 0)
          }

          $backendChanged = Test-SurfaceChanged -Name "backend" -PathPrefix "backend"
          # Re-running manually must apply changed Discord secrets/settings too.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $backendChanged = $true }
          $frontendChanged = Test-SurfaceChanged -Name "frontend" -PathPrefix "frontend"
          # A reboot or a lost PM2 daemon leaves the frontend stopped while its
          # marker still says "deployed"; redeploy it instead of skipping.
          if (-not $frontendChanged -and -not (Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue)) {
            Write-Host "frontend: nothing is listening on port 3000; deploying."
            $frontendChanged = $true
          }

          "backend_changed=$($backendChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "frontend_changed=$($frontendChanged.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # A failed marker lookup above must not fail the step.
          exit 0
 
      - name: Create Env Files
        shell: cmd
        env:
          PRIMEFLOW_MCP_EMAIL: ${{ secrets.PRIMEFLOW_MCP_EMAIL }}
          PRIMEFLOW_MCP_PASSWORD: ${{ secrets.PRIMEFLOW_MCP_PASSWORD }}
          PRIMEFLOW_READONLY_DATABASE_URL: ${{ secrets.PRIMEFLOW_READONLY_DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_STORAGE_DIR: ${{ vars.REPORT_STORAGE_DIR }}
          MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID || secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: |
          if not defined MS_CLIENT_ID (echo ::error::MS_CLIENT_ID is missing from GitHub Actions Variables or Secrets & exit /b 1)
          if not defined MS_TENANT_ID (echo ::error::MS_TENANT_ID is missing from GitHub Actions Variables or Secrets & exit /b 1)
          if not defined MS_CLIENT_SECRET (echo ::error::MS_CLIENT_SECRET is missing from GitHub Actions Secrets & exit /b 1)
          if not defined EMAIL_USER (echo ::error::EMAIL_USER is missing from GitHub Actions Secrets & exit /b 1)
          if not defined EMAIL_PASSWORD (echo ::error::EMAIL_PASSWORD is missing from GitHub Actions Secrets & exit /b 1)
          echo NEXT_PUBLIC_API_BASE_URL=https://api-flow.primexeu.com > frontend\.env.local
          echo DATABASE_URL=postgresql+asyncpg://postgres:12345678@localhost:5433/primex_nexus > backend\.env
          echo DB_POOL_SIZE=20 >> backend\.env
          echo DB_MAX_OVERFLOW=20 >> backend\.env
          echo DB_POOL_TIMEOUT=30 >> backend\.env
          echo DB_POOL_RECYCLE=1800 >> backend\.env
          echo JWT_SECRET=primex_nexus_secret_key_2026 >> backend\.env
          echo REDIS_ENABLED=true >> backend\.env
          echo REDIS_URL=redis://127.0.0.1:6379/0 >> backend\.env
          echo APP_TIMEZONE=Europe/Budapest >> backend\.env
          echo CORS_ORIGINS=https://primeflow.primexeu.com,https://api-flow.primexeu.com >> backend\.env
          echo FRONTEND_URL=https://primeflow.primexeu.com >> backend\.env
          echo MS_CLIENT_ID=%MS_CLIENT_ID% >> backend\.env
          echo MS_TENANT_ID=%MS_TENANT_ID% >> backend\.env
          echo MS_CLIENT_SECRET=%MS_CLIENT_SECRET% >> backend\.env
          echo MS_REDIRECT_URI=https://api-flow.primexeu.com/api/microsoft/callback >> backend\.env
          echo MS_ORGANIZER_EMAIL=info@primexeu.com >> backend\.env
          echo MS_CALENDAR_SYNC_PAST_DAYS=0 >> backend\.env
          echo MS_CALENDAR_SYNC_FUTURE_DAYS=14 >> backend\.env
          echo DEVELOPMENT_CLIENTS_PATH=\\192.168.10.8\Files\10_ZHVILLIM\05_CLIENTS >> backend\.env
          echo PRODUCT_CLIENTS_PATH=\\192.168.10.8\Klientat\05_CLIENTS >> backend\.env
          echo PRIMEFLOW_API_BASE_URL=https://api-flow.primexeu.com >> backend\.env
          echo PRIMEFLOW_WEB_BASE_URL=https://primeflow.primexeu.com >> backend\.env
          echo PRIMEFLOW_MCP_TRANSPORT=sse >> backend\.env
          echo PRIMEFLOW_MCP_HOST=0.0.0.0 >> backend\.env
          echo PRIMEFLOW_MCP_PORT=8010 >> backend\.env
          echo PRIMEFLOW_EMAIL=%PRIMEFLOW_MCP_EMAIL% >> backend\.env
          echo PRIMEFLOW_PASSWORD=%PRIMEFLOW_MCP_PASSWORD% >> backend\.env
          echo PRIMEFLOW_READONLY_DATABASE_URL=%PRIMEFLOW_READONLY_DATABASE_URL% >> backend\.env
          echo PRIMEFLOW_REPORT_TIMEZONE=Europe/Tirane >> backend\.env
          echo PRIMEFLOW_REPORT_RECIPIENTS=130primex.eu@gmail.com,ga@primexeu.com >> backend\.env
          echo EMAIL_HOST=smtp.gmail.com >> backend\.env
          echo EMAIL_PORT=587 >> backend\.env
          echo EMAIL_USER=%EMAIL_USER% >> backend\.env
          echo EMAIL_PASSWORD=%EMAIL_PASSWORD% >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_ENABLED=true >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_TIMEZONE=Europe/Tirane >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_RECIPIENTS=130primex.eu@gmail.com,info@primexeu.com,ga@primexeu.com >> backend\.env
          echo REPORT_STORAGE_DIR=%REPORT_STORAGE_DIR% >> backend\.env
          echo REPORT_RETENTION_DAYS=90 >> backend\.env
          echo OPENAI_API_KEY=%OPENAI_API_KEY% >> backend\.env
          echo SKILLS_AI_MODEL=gpt-5.4-nano >> backend\.env
          echo SKILLS_AI_TIMEOUT_SECONDS=20 >> backend\.env
          echo REALIZATION_AI_ENABLED=true >> backend\.env
          echo REALIZATION_AI_MODEL=gpt-5.2 >> backend\.env
          echo REALIZATION_AI_TIMEOUT_SECONDS=45 >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_ENABLED=true >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_MODEL=gpt-5.2 >> backend\.env
          echo WEEKLY_PLANNING_AUDIT_AI_TIMEOUT_SECONDS=90 >> backend\.env
 
      - name: Configure Discord Assistant
        shell: powershell
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BRIDGE_SECRET: ${{ secrets.DISCORD_BRIDGE_SECRET }}
          DISCORD_ASSISTANT_ENABLED: ${{ vars.DISCORD_ASSISTANT_ENABLED }}
          DISCORD_CATEGORY_ID: ${{ vars.DISCORD_CATEGORY_ID }}
          DISCORD_MEETING_VOICE_CHANNEL_ID: ${{ vars.DISCORD_MEETING_VOICE_CHANNEL_ID }}
          DISCORD_MESSAGE_CONTENT_ENABLED: ${{ vars.DISCORD_MESSAGE_CONTENT_ENABLED }}
          DISCORD_AI_MODEL: ${{ vars.DISCORD_AI_MODEL }}
          DISCORD_AGENT_MODEL: ${{ vars.DISCORD_AGENT_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" backend/scripts/configure_discord.py
          if ($LASTEXITCODE -ne 0) { throw "Discord configuration failed. Check the required Actions secrets." }

      - name: Prepare Backend
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: cmd
        run: |
          cd backend
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m pip install -r requirements-discord.txt
          if errorlevel 1 exit /b 1
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m py_compile mcp_server.py app\api\routers\search.py app\schemas\search.py
          if errorlevel 1 exit /b 1
          REM Import the complete ASGI application before deleting any live PM2
          REM process. This catches missing modules and startup-time config errors.
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -c "from app.main import app; print('Backend application import: OK')"
          if errorlevel 1 exit /b 1
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m unittest tests.test_mcp_server tests.test_migration_graph
          if errorlevel 1 exit /b 1
          "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe" -m unittest discover -s tests -p "test_discord*.py"
          if errorlevel 1 exit /b 1

      - name: Apply Database Migrations
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location backend
          $python = "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe"

          $headOutput = @(& $python -m alembic heads)
          if ($LASTEXITCODE -ne 0) {
            $headOutput | ForEach-Object { Write-Host $_ }
            throw "Unable to inspect Alembic heads."
          }
          $headLines = @($headOutput | Where-Object { "$_" -match '\(head\)' })
          if ($headLines.Count -ne 1) {
            $headOutput | ForEach-Object { Write-Host $_ }
            throw "Expected exactly one Alembic head; found $($headLines.Count)."
          }
          $expectedHead = ("$($headLines[0])" -split '\s+')[0]
          Write-Host "Alembic repository head: $expectedHead"

          # Validate both the repository graph and the deployed database stamp
          # before stopping a running report scheduler.
          & $python -m alembic current
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the current database revision."
          }

          # Prevent the legacy scheduler from reloading rows while migrations run.
          cmd /c "pm2 stop primeflow-report-scheduler || ver > NUL" | Out-Host
          cmd /c "pm2 stop primeflow-discord || ver > NUL" | Out-Host

          & $python -m alembic upgrade head
          if ($LASTEXITCODE -ne 0) {
            throw "Alembic upgrade failed."
          }

          & $python -m scripts.verify_deployed_schema
          if ($LASTEXITCODE -ne 0) {
            throw "Required migration columns are missing."
          }

          # Capture stdout only. Alembic writes normal INFO logging to stderr,
          # which Windows PowerShell 5 converts to NativeCommandError when merged.
          $currentOutput = @(& $python -m alembic current)
          if ($LASTEXITCODE -ne 0) {
            $currentOutput | ForEach-Object { Write-Host $_ }
            throw "Unable to verify the upgraded database revision."
          }
          $currentOutput | ForEach-Object { Write-Host $_ }
          if (-not ($currentOutput -join "`n").Contains($expectedHead)) {
            throw "Database revision does not match repository head $expectedHead."
          }
          Write-Host "Alembic migrations completed at $expectedHead."

      - name: Ensure Redis Notification Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $service = Get-Service -Name Memurai -ErrorAction Stop
          if ($service.Status -ne "Running") {
            Write-Host "Starting Memurai for realtime browser notifications..."
            Start-Service -Name Memurai
          }

          $ready = $false
          for ($i = 0; $i -lt 15; $i++) {
            $connection = Test-NetConnection -ComputerName 127.0.0.1 -Port 6379 -WarningAction SilentlyContinue
            if ($connection.TcpTestSucceeded) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            throw "Memurai is not accepting Redis connections on 127.0.0.1:6379."
          }
          Write-Host "Redis notification service is ready."

      - name: Restart Backend Services
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: cmd
        env:
          PRIMEFLOW_MCP_EMAIL: ${{ secrets.PRIMEFLOW_MCP_EMAIL }}
          PRIMEFLOW_MCP_PASSWORD: ${{ secrets.PRIMEFLOW_MCP_PASSWORD }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd backend
 
          REM Celery worker and Beat own weekly audit generation and delivery.
          REM Delete each managed process explicitly. PM2's --only option accepts a
          REM single ecosystem app name; a comma-separated value leaves the old
          REM scheduler supervised and PM2 immediately respawns it after it is killed.
          call pm2 delete primex-backend || ver > NUL
          call pm2 delete primeflow-mcp || ver > NUL
          call pm2 delete primeflow-discord || ver > NUL
          call pm2 delete primeflow-report-scheduler || ver > NUL
          call pm2 delete primex-tomorrow-shtypi-scheduler || ver > NUL
          call pm2 delete celery_worker || ver > NUL
          call pm2 delete celery_beat || ver > NUL

          REM PM2 can only delete processes it still owns. Remove any orphaned
          REM legacy scheduler before the new one can compete for delivery locks.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\ensure_single_report_scheduler.ps1 -Mode Stop
          if errorlevel 1 exit /b 1

          REM Stop legacy backend process names so the current checkout owns the API port.
          set REDIS_ENABLED=true
          set REDIS_URL=redis://127.0.0.1:6379/0
          set APP_TIMEZONE=Europe/Budapest
          set APP_BUILD_SHA=${{ github.sha }}
          REM MCP and the report scheduler must verify the freshly restarted
          REM private backend. Falling back to api-flow here can test an older
          REM public deployment and make the functional MCP check fail.
          set PRIMEFLOW_API_BASE_URL=http://127.0.0.1:8000
          set PRIMEFLOW_EMAIL=%PRIMEFLOW_MCP_EMAIL%
          set PRIMEFLOW_PASSWORD=%PRIMEFLOW_MCP_PASSWORD%
          set PRIMEFLOW_REPORT_TIMEZONE=Europe/Tirane
          set PRIMEFLOW_REPORT_RECIPIENTS=130primex.eu@gmail.com,ga@primexeu.com
          set WEEKLY_PLANNING_AUDIT_ENABLED=true
          set WEEKLY_PLANNING_AUDIT_TIMEZONE=Europe/Tirane
          set WEEKLY_PLANNING_AUDIT_RECIPIENTS=130primex.eu@gmail.com,info@primexeu.com,ga@primexeu.com
          set REPORT_RETENTION_DAYS=90
          set RUNNER_TRACKING_ID=
          call pm2 delete backend-api || ver > NUL
          call pm2 delete backend || ver > NUL

          REM Kill any orphaned process still holding port 8000 (a squatter outside PM2
          REM keeps serving stale code and makes health checks pass against old builds).
          powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Write-Host ('Killing stale listener PID ' + $_ + ' on port 8000'); Stop-Process -Id $_ -Force }"
          powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 8010 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Write-Host ('Killing stale listener PID ' + $_ + ' on port 8010'); Stop-Process -Id $_ -Force }"

          call pm2 start ecosystem.config.cjs --only primex-backend --update-env
          if errorlevel 1 exit /b 1
          call pm2 start ecosystem.config.cjs --only primeflow-mcp --update-env
          if errorlevel 1 exit /b 1
          call pm2 start ecosystem.config.cjs --only primeflow-report-scheduler --update-env
          if errorlevel 1 exit /b 1
          call pm2 start ecosystem.config.cjs --only primex-tomorrow-shtypi-scheduler --update-env
          if errorlevel 1 exit /b 1
          call pm2 start ecosystem.config.cjs --only celery_worker --update-env
          if errorlevel 1 exit /b 1
          call pm2 start ecosystem.config.cjs --only celery_beat --update-env
          if errorlevel 1 exit /b 1
          call pm2 describe primex-backend | findstr /I "status"
          call pm2 describe primeflow-mcp | findstr /I "status"
          call pm2 describe primeflow-report-scheduler | findstr /I "status"
          call pm2 describe primex-tomorrow-shtypi-scheduler | findstr /I "status"
          call pm2 describe celery_worker | findstr /I "status"
          call pm2 describe celery_beat | findstr /I "status"
          echo PM2 backend restart/start completed.
 
      - name: Wait for Backend Readiness
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        run: |
          $ok = $false
          $expected = "${{ github.sha }}"
          $lastBuild = "<no response>"
          $uri = "http://127.0.0.1:8000/health"
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 3
              $body = $resp.Content | ConvertFrom-Json
              $lastBuild = "$($body.build)"
              Write-Host "Backend health check attempt $($i + 1)/20: HTTP $($resp.StatusCode) build=$lastBuild"
              if ($resp.StatusCode -eq 200 -and $lastBuild -eq $expected) {
                $ok = $true
                break
              }
              Start-Sleep -Seconds 2
            } catch {
              Write-Host "Backend health check attempt $($i + 1)/20: no response yet"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            cmd /c "pm2 status"
            cmd /c "pm2 logs primex-backend --lines 100 --nostream || ver > NUL"
            Write-Error "Backend /health not serving deployed build $expected (last seen: $lastBuild). A stale process may be holding port 8000."
            exit 1
          }
          Write-Host "Backend health check: OK ($uri) serving build $expected"

      - name: Start Discord Assistant
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location backend
          $python = "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe"
          $discordConfig = (& $python scripts/configure_discord.py --status) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Discord configuration." }
          if (-not $discordConfig.enabled) {
            Write-Host "Discord assistant is disabled; no bot process started."
            exit 0
          }
          Remove-Item -LiteralPath ".discord-worker-status.json" -Force -ErrorAction SilentlyContinue
          cmd /c "pm2 start ecosystem.config.cjs --only primeflow-discord --update-env" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Unable to start the Discord bot." }
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path -LiteralPath ".discord-worker-status.json") {
              $status = Get-Content -LiteralPath ".discord-worker-status.json" -Raw | ConvertFrom-Json
              if ($status.build -eq $env:APP_BUILD_SHA -and $status.guild_id -eq $discordConfig.guild_id) {
                $ready = $true
                break
              }
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            throw "Discord bot did not connect. Check DISCORD_BOT_TOKEN, DISCORD_GUILD_ID, the bot's server membership and Message Content Intent."
          }
          Write-Host "Discord assistant connected and slash commands registered."

      - name: Wait for MCP Readiness
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        run: |
          $ok = $false
          $port = 8010
          for ($i = 0; $i -lt 20; $i++) {
            $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($listener) {
              Write-Host "MCP readiness attempt $($i + 1)/20: listening on port $port (PID $($listener.OwningProcess))"
              $ok = $true
              break
            }
            Write-Host "MCP readiness attempt $($i + 1)/20: port $port not listening yet"
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            cmd /c "pm2 status"
            cmd /c "pm2 logs primeflow-mcp --lines 100 --nostream || ver > NUL"
            Write-Error "Primeflow MCP did not start listening on port $port."
            exit 1
          }
          Write-Host "Primeflow MCP readiness: OK"

      - name: Functional MCP and Scheduler Readiness
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        run: |
          Set-Location backend
          $python = "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe"
          & $python scripts\check_mcp.py --url http://127.0.0.1:8010/sse --call-common-view
          if ($LASTEXITCODE -ne 0) {
            cmd /c "pm2 logs primeflow-mcp --lines 100 --nostream || ver > NUL"
            exit 1
          }
          # Do not pipe `pm2 jlist` through ConvertFrom-Json. PM2 includes the
          # Windows environment in that payload, where case-insensitive keys
          # such as `username` and `USERNAME` make PowerShell reject valid JSON.
          $schedulerDescription = cmd /c "pm2 describe primeflow-report-scheduler"
          $schedulerDescribeExit = $LASTEXITCODE
          # ASCII-only expression: GitHub's Windows runner can transcode PM2's
          # Unicode table separator while materializing this PowerShell script.
          $schedulerOnline = $schedulerDescription -match '(?im)status.*online'
          if ($schedulerDescribeExit -ne 0 -or -not $schedulerOnline) {
            cmd /c "pm2 logs primeflow-report-scheduler --lines 100 --nostream || ver > NUL"
            Write-Error "PrimeFlow report scheduler is not online."
            exit 1
          }
          $tomorrowShtypiDescription = cmd /c "pm2 describe primex-tomorrow-shtypi-scheduler"
          $tomorrowShtypiDescribeExit = $LASTEXITCODE
          $tomorrowShtypiOnline = $tomorrowShtypiDescription -match '(?im)status.*online'
          if ($tomorrowShtypiDescribeExit -ne 0 -or -not $tomorrowShtypiOnline) {
            cmd /c "pm2 logs primex-tomorrow-shtypi-scheduler --lines 100 --nostream || ver > NUL"
            Write-Error "Tomorrow 1H SHTYPI scheduler is not online."
            exit 1
          }
          try {
            & .\scripts\ensure_single_report_scheduler.ps1 -Mode Verify
          } catch {
            cmd /c "pm2 logs primeflow-report-scheduler --lines 100 --nostream || ver > NUL"
            throw
          }
          & $python -m scripts.check_report_scheduler
          if ($LASTEXITCODE -ne 0) {
            cmd /c "pm2 logs primeflow-report-scheduler --lines 100 --nostream || ver > NUL"
            exit 1
          }
 
      - name: Replace Public API Backend
        if: ${{ steps.changes.outputs.backend_changed == 'true' }}
        shell: powershell
        run: |
          Set-Location backend

          $python = "C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe"
          $port = 8080
          $processName = "backend-api-flow"

          Write-Host "Replacing public API backend on port $port from current checkout..."
          cmd /c "pm2 delete backend-api-flow || ver > NUL" | Out-Host
          cmd /c "pm2 delete primex-public-api || ver > NUL" | Out-Host

          # Kill any orphaned process still holding the port (a squatter outside PM2
          # keeps serving stale code and makes health checks pass against old builds).
          Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty OwningProcess -Unique |
            ForEach-Object {
              Write-Host "Killing stale listener PID $_ on port $port"
              Stop-Process -Id $_ -Force
            }

          # The public API terminates browser WebSocket connections and must
          # consume Redis notification events for realtime alerts and sounds.
          $env:REDIS_ENABLED = "true"
          $env:REDIS_URL = "redis://127.0.0.1:6379/0"
          $env:APP_TIMEZONE = "Europe/Budapest"
          # The primary API on port 8000 exclusively owns the shared Outlook
          # calendar scheduler. Running it here as well causes duplicate imports
          # and competing long-lived database work.
          $env:MS_CALENDAR_SYNC_ENABLED = "false"
          # This process serves every browser request with several workers, and
          # each worker runs the startup hooks. All schedulers therefore belong
          # to the primary API on port 8000 (or their own PM2 process) only;
          # leaving one enabled here would run it once per worker.
          $env:SYSTEM_TASK_SCHEDULER_ENABLED = "false"
          $env:REPORT_SCHEDULERS_ENABLED = "false"
          $env:TOMORROW_PRINT_REPORT_SCHEDULER_ENABLED = "false"
          $env:TODAY_PRINT_REPORT_SCHEDULER_ENABLED = "false"
          $env:STD_FEEDBACK_SYNC_ENABLED = "false"
          $env:MEETING_REMINDER_SCHEDULER_ENABLED = "false"
          # Keep the total across workers well under PostgreSQL's connection limit.
          $env:DB_POOL_SIZE = "5"
          $env:DB_MAX_OVERFLOW = "5"
          $env:APP_BUILD_SHA = "${{ github.sha }}"
          $env:RUNNER_TRACKING_ID = ""
          # The server has 8 slow cores and one Python process can use only one,
          # so a single worker stalled every user behind any heavy request.
          cmd /c "pm2 start `"$python`" --name $processName --cwd `"$PWD`" -- -m uvicorn app.main:app --host 0.0.0.0 --port $port --workers 4 --timeout-keep-alive 15 --backlog 2048"
          if ($LASTEXITCODE -ne 0) { Write-Error "PM2 public API start failed"; exit 1 }

          $ok = $false
          $expected = "${{ github.sha }}"
          $lastBuild = "<no response>"
          $uri = "http://127.0.0.1:$port/health"
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 3
              $body = $resp.Content | ConvertFrom-Json
              $lastBuild = "$($body.build)"
              Write-Host "Public API health check attempt $($i + 1)/40: HTTP $($resp.StatusCode) build=$lastBuild"
              if ($resp.StatusCode -eq 200 -and $lastBuild -eq $expected) {
                $ok = $true
                break
              }
              Start-Sleep -Seconds 2
            } catch {
              Write-Host "Public API health check attempt $($i + 1)/40: no response yet"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Error "Public API /health not serving deployed build $expected (last seen: $lastBuild). A stale process may be holding port $port."
            exit 1
          }

          $stateDir = Join-Path $env:PM2_HOME "primeflow-deploy"
          Set-Content -Path (Join-Path $stateDir "backend.sha") -Value $expected -Encoding ascii
 
      - name: Update Frontend
        if: ${{ steps.changes.outputs.frontend_changed == 'true' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location frontend
 
          Write-Host "1. Installing Dependencies..."
          npm install
          if ($LASTEXITCODE -ne 0) { Write-Error "NPM Install Failed"; exit 1 }
 
          # Build beside the live .next directory. The current PM2 process keeps
          # serving traffic unless and until this candidate build succeeds.
          Write-Host "2. Building Candidate Version..."
          if (Test-Path .next-deploy) {
            Remove-Item .next-deploy -Recurse -Force
          }
          $env:NEXT_DIST_DIR = ".next-deploy"
          $env:NEXT_DEPLOYMENT_ID = "${{ github.sha }}"
          npm run build
          $buildExitCode = $LASTEXITCODE
          Remove-Item Env:NEXT_DIST_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:NEXT_DEPLOYMENT_ID -ErrorAction SilentlyContinue
          if ($buildExitCode -ne 0) {
            Write-Error "Candidate build failed; the existing frontend was left running."
            exit 1
          }

          $CurrentPath = (Get-Location).Path
          $env:RUNNER_TRACKING_ID = ""

          # `Start-Process -Wait` also waits for every descendant process. When the
          # PM2 command leaves a child behind, the step hangs forever after PM2
          # has already printed "Done" and blocks all later deploys. Wait only
          # for the command itself, with a limit.
          function Invoke-Pm2Command {
            param([string]$Command, [int]$TimeoutSeconds = 90)

            $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $Command -NoNewWindow -PassThru
            $null = $process.Handle
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              Write-Host "PM2 command did not return within $TimeoutSeconds s; continuing. Command: $Command"
              return $null
            }
            return $process.ExitCode
          }

          function Start-PrimeFlowFrontend {
            $exitCode = Invoke-Pm2Command "pm2 start node_modules/next/dist/bin/next --name frontend --cwd ""$CurrentPath"" --interpreter node -- start --port 3000"
            # A timeout is not treated as failure: the readiness check that
            # follows decides whether the new frontend is really serving.
            if ($null -ne $exitCode -and $exitCode -ne 0) {
              throw "PM2 frontend start failed with exit code $exitCode."
            }
          }

          function Wait-PrimeFlowFrontend {
            param([string]$ExpectedDeploymentId = "")

            $uri = "http://127.0.0.1:3000/admin-tasks?deploy-check=$ExpectedDeploymentId"
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri $uri -UseBasicParsing -Headers @{ "Cache-Control" = "no-cache" } -TimeoutSec 3
                Write-Host "Frontend readiness attempt $($i + 1)/20: HTTP $($resp.StatusCode)"
                if ($resp.StatusCode -eq 200) {
                  if ([string]::IsNullOrWhiteSpace($ExpectedDeploymentId)) { return $true }

                  $deploymentMarker = "?dpl=$ExpectedDeploymentId"
                  if ($resp.Content.Contains($deploymentMarker)) {
                    Write-Host "Frontend is serving deployment $ExpectedDeploymentId."
                    return $true
                  }
                  Write-Host "Port 3000 answered, but it is not serving deployment $ExpectedDeploymentId."
                }
              } catch {
                Write-Host "Frontend readiness attempt $($i + 1)/20: no response yet"
              }
              Start-Sleep -Seconds 2
            }
            return $false
          }

          function Stop-StalePrimeFlowFrontendListener {
            $listeners = @(Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue)
            foreach ($listener in $listeners) {
              $listenerPid = $listener.OwningProcess
              $listenerProcess = Get-CimInstance Win32_Process -Filter "ProcessId=$listenerPid" -ErrorAction SilentlyContinue
              $commandLine = if ($listenerProcess) { [string]$listenerProcess.CommandLine } else { "" }
              $isPrimeFlowFrontend =
                $commandLine.IndexOf($CurrentPath, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                $commandLine.IndexOf("next", [System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                $commandLine.IndexOf("start", [System.StringComparison]::OrdinalIgnoreCase) -ge 0

              if (-not $isPrimeFlowFrontend) {
                throw "Port 3000 is held by unrelated PID $listenerPid. Command: $commandLine"
              }

              Write-Host "Stopping stale PrimeFlow frontend listener PID $listenerPid."
              Stop-Process -Id $listenerPid -Force -ErrorAction Stop
            }

            for ($i = 0; $i -lt 20; $i++) {
              if (-not (Get-NetTCPConnection -LocalPort 3000 -State Listen -ErrorAction SilentlyContinue)) {
                return
              }
              Start-Sleep -Milliseconds 250
            }
            throw "Port 3000 did not become free after stopping the stale PrimeFlow frontend."
          }

          Write-Host "3. Replacing Existing Frontend Process..."
          $pm2DescribeExit = Invoke-Pm2Command "pm2 describe frontend > NUL 2>&1"
          if ($pm2DescribeExit -eq 0) {
            $pm2DeleteExit = Invoke-Pm2Command "pm2 delete frontend"
            if ($null -ne $pm2DeleteExit -and $pm2DeleteExit -ne 0) { Write-Error "PM2 frontend delete failed"; exit 1 }
          } else {
            Write-Host "PM2 frontend process did not exist yet. Continuing with clean start."
          }

          # A frontend started outside PM2 can survive `pm2 delete`, keep the old
          # build in memory, and make a plain HTTP readiness check pass. Stop only
          # a listener whose command belongs to this exact PrimeFlow checkout.
          Stop-StalePrimeFlowFrontendListener
 
          if (Test-Path .next-previous) {
            Remove-Item .next-previous -Recurse -Force
          }
          if (Test-Path .next) {
            Move-Item .next .next-previous
          }

          try {
            Move-Item .next-deploy .next
            Start-PrimeFlowFrontend
            if (-not (Wait-PrimeFlowFrontend -ExpectedDeploymentId "${{ github.sha }}")) {
              throw "The candidate frontend did not serve deployment ${{ github.sha }} on port 3000."
            }
            Write-Host "Candidate frontend is healthy. Previous build retained in .next-previous for rollback."
          } catch {
            $deploymentError = $_.Exception.Message
            Write-Host "Candidate deployment failed: $deploymentError"
            cmd /c "pm2 delete frontend || ver > NUL" | Out-Host
            if (Test-Path .next) {
              Remove-Item .next -Recurse -Force
            }
            if (Test-Path .next-previous) {
              Move-Item .next-previous .next
              Start-PrimeFlowFrontend
              if (-not (Wait-PrimeFlowFrontend)) {
                Write-Error "Candidate failed and the previous frontend could not be restored. Original error: $deploymentError"
                exit 1
              }
              Write-Host "Previous frontend restored successfully."
            } else {
              Write-Host "No previous frontend build was available to restore."
            }
            Write-Error "Frontend deployment failed and was rolled back: $deploymentError"
            exit 1
          }
 
      - name: Wait for Frontend Readiness
        if: ${{ steps.changes.outputs.frontend_changed == 'true' }}
        shell: powershell
        run: |
          $ok = $false
          $expectedDeploymentId = "${{ github.sha }}"
          $uri = "http://127.0.0.1:3000/admin-tasks?deploy-check=$expectedDeploymentId"
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $uri -UseBasicParsing -Headers @{ "Cache-Control" = "no-cache" } -TimeoutSec 3
              Write-Host "Frontend readiness attempt $($i + 1)/20: HTTP $($resp.StatusCode)"
              if ($resp.StatusCode -eq 200 -and $resp.Content.Contains("?dpl=$expectedDeploymentId")) {
                $ok = $true
                break
              }
              Write-Host "Port 3000 answered, but it is not serving deployment $expectedDeploymentId."
            } catch {
              Write-Host "Frontend readiness attempt $($i + 1)/20: no response yet"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) {
            Write-Error "Frontend did not serve deployment $expectedDeploymentId on port 3000."
            exit 1
          }
          Write-Host "Frontend readiness check: OK ($expectedDeploymentId)"
          $stateDir = Join-Path $env:PM2_HOME "primeflow-deploy"
          Set-Content -Path (Join-Path $stateDir "frontend.sha") -Value $expectedDeploymentId -Encoding ascii
 
      - name: Save PM2 Process List
        if: ${{ steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.frontend_changed == 'true' }}
        shell: cmd
        run: |
          pm2 save

      - name: Register PM2 Boot Recovery
        shell: powershell
        run: |
          # PM2 does not come back by itself after a Windows restart. This task
          # restores the saved process list at boot so the site returns without
          # waiting for the next deploy. It must never fail a deploy.
          try {
            $pm2Dir = Split-Path (Get-Command pm2 -ErrorAction Stop).Source
            $nodeDir = Split-Path (Get-Command node -ErrorAction Stop).Source
            $script = Join-Path $env:PM2_HOME "primeflow-resurrect.cmd"
            $log = Join-Path $env:PM2_HOME "primeflow-resurrect.log"
            $lines = @(
              "@echo off",
              "set PM2_HOME=$($env:PM2_HOME)",
              "set RUNNER_TRACKING_ID=",
              "set PATH=$pm2Dir;$nodeDir;%PATH%",
              "echo %DATE% %TIME% boot resurrect >> ""$log""",
              "call pm2 resurrect >> ""$log"" 2>&1"
            )
            Set-Content -Path $script -Value $lines -Encoding ascii

            $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c ""$script"""
            $trigger = New-ScheduledTaskTrigger -AtStartup
            # Give PostgreSQL and Redis a moment to start first.
            $trigger.Delay = "PT45S"
            $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -LogonType ServiceAccount -RunLevel Highest
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -ExecutionTimeLimit ([TimeSpan]::Zero)
            Register-ScheduledTask -TaskName "PrimeFlow PM2 Resurrect" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
            Write-Host "Boot recovery task registered: $script"
          } catch {
            Write-Host "::warning::Could not register the PM2 boot recovery task: $_"
          }
          exit 0

      - name: Deploy Observability
        if: ${{ failure() }}
        shell: cmd
        run: |
          call pm2 status
          call pm2 logs primex-backend --lines 50 --nostream || ver > NUL
          call pm2 logs primeflow-report-scheduler --lines 100 --nostream || ver > NUL
