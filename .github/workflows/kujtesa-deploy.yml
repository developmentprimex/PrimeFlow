name: Kujtesa Independent Deploy
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: Base64 release ZIP; empty performs read-only inspection
        required: false
        default: ''
      bundle_tail:
        description: Second release chunk for Windows environment size limits
        required: false
        default: ''
      sha:
        description: KUJTESA-BOT commit SHA
        required: false
        default: ''
      digest:
        description: SHA256 of ZIP
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: primeflow-production-deploy
  cancel-in-progress: false
jobs:
  kujtesa:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PM2_HOME: C:\pm2-system
      RUNNER_TRACKING_ID: ''
    steps:
      - name: Inspect dedicated family process
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:/Users/Administrator/AppData/Local/Programs/Python/Python313/python.exe'
          @'
          import base64,json,subprocess
          from pathlib import Path
          from nacl.public import PrivateKey
          key=Path('C:/PrimeFlowData/Kujtesa/deploy-sealed.key')
          if not key.exists():
              with key.open('xb') as f: f.write(bytes(PrivateKey.generate()))
          print('DEPLOY_PUBLIC_KEY',base64.b64encode(bytes(PrivateKey(key.read_bytes()).public_key)).decode())
          p=subprocess.run(['cmd','/c','pm2','jlist'],text=True,capture_output=True,check=True)
          print('PROCESSES',json.dumps([{'name':x['name'],'pid':x.get('pid'),'status':x['pm2_env']['status'],'cwd':x['pm2_env'].get('pm_cwd'),'script':x['pm2_env'].get('pm_exec_path'),'args':x['pm2_env'].get('args')} for x in json.loads(p.stdout)]))
          env=Path('C:/PrimeFlowData/Kujtesa/.env')
          values={}
          if env.exists():
              for line in env.read_text(encoding='utf-8-sig').splitlines():
                  if '=' in line and not line.lstrip().startswith('#'):
                      k,v=line.split('=',1)
                      try:v=json.loads(v)
                      except ValueError:v=v.strip().strip("'")
                      values[k]=v
          print('FAMILY_CONFIG',json.dumps({'exists':env.exists(),'keys':sorted(values),'enabled':values.get('KUJTESA_ENABLED'),'reminders_enabled':values.get('REMINDERS_ENABLED'),'voice_enabled':values.get('KUJTESA_HOST_ENABLED'),'voice_worker':values.get('KUJTESA_HOST_WORKER'),'api_url':values.get('PRIMEFLOW_API_URL')}))
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect family process.' }
      - name: Deploy only the independent Kujtesa release
        if: ${{ inputs.bundle != '' }}
        shell: powershell
        env:
          KUJTESA_RELEASE_BUNDLE: ${{ inputs.bundle }}
          KUJTESA_RELEASE_BUNDLE_TAIL: ${{ inputs.bundle_tail }}
          KUJTESA_RELEASE_SHA: ${{ inputs.sha }}
          KUJTESA_RELEASE_DIGEST: ${{ inputs.digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'C:/Users/Administrator/AppData/Local/Programs/Python/Python313/python.exe'
          $stage = Join-Path $env:RUNNER_TEMP ('kujtesa-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $stage | Out-Null
          $env:KUJTESA_RELEASE_STAGE = $stage
          @'
          import base64,hashlib,io,os,re,zipfile
          from pathlib import Path
          from nacl.public import PrivateKey,SealedBox
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['KUJTESA_RELEASE_SHA'])
          data=base64.b64decode(os.environ['KUJTESA_RELEASE_BUNDLE']+os.environ.get('KUJTESA_RELEASE_BUNDLE_TAIL',''),validate=True)
          assert hashlib.sha256(data).hexdigest()==os.environ['KUJTESA_RELEASE_DIGEST'],'Release digest mismatch'
          data=SealedBox(PrivateKey(Path('C:/PrimeFlowData/Kujtesa/deploy-sealed.key').read_bytes())).decrypt(data)
          root=Path(os.environ['KUJTESA_RELEASE_STAGE']).resolve()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert sum(i.file_size for i in archive.infolist())<5000000
              for item in archive.infolist():
                  dest=(root/item.filename).resolve()
                  assert dest.is_relative_to(root) and not item.filename.startswith(('/', '\\'))
                  assert item.filename not in {'.env','.primeflow-receipts.json','.kujtesa-worker-status.json'}
              archive.extractall(root)
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed.' }
          Remove-Item Env:KUJTESA_RELEASE_BUNDLE, Env:KUJTESA_RELEASE_BUNDLE_TAIL
          & $python (Join-Path $stage 'scripts/deploy_server.py') --source $stage --sha $env:KUJTESA_RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Kujtesa deployment failed; inspect rollback result.' }
