name: Mira Audio Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primeflow-production-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Read audio status without meeting content
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'backend')
          @'
          import asyncio, json
          from sqlalchemy import text
          from app.db import engine
          async def main():
              async with engine.connect() as c:
                  await c.execute(text('SET TRANSACTION READ ONLY'))
                  meetings = (await c.execute(text('SELECT id, status, partial, error, created_at, started_at, stopped_at, heartbeat_at, memory_status, memory_attempts, memory_error FROM discord_voice_meetings ORDER BY created_at DESC LIMIT 5'))).mappings().all()
                  for row in meetings:
                      print('MIRA_SESSION', json.dumps(dict(row), default=str))
                      segments = (await c.execute(text('SELECT sequence, status, error, start_ms, end_ms FROM discord_voice_segments WHERE session_id=:id ORDER BY sequence'), {'id': row['id']})).mappings().all()
                      print('MIRA_SEGMENTS', json.dumps([dict(s) for s in segments], default=str))
              await engine.dispose()
          asyncio.run(main())
          '@ | & 'C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe' -
          if ($LASTEXITCODE -ne 0) { throw 'Audio status query failed.' }
          @'
          import asyncio, json
          from sqlalchemy import text
          from app.db import engine
          async def main():
              for sql in ('SELECT version_num FROM alembic_version',
                          'SELECT id, enabled_until, ga_participants FROM mira_host_settings',
                          'SELECT id, meeting_date, slot, status, started_at, ended_at, error FROM mira_1h_meetings ORDER BY created_at DESC LIMIT 5',
                          'SELECT key, kind, slot, sent_at FROM mira_1h_events ORDER BY created_at DESC LIMIT 20'):
                  async with engine.connect() as c:
                      await c.execute(text('SET TRANSACTION READ ONLY'))
                      try:
                          rows = (await c.execute(text(sql))).mappings().all()
                          print('MIRA_HOST_DB', sql[:45], json.dumps([dict(r) for r in rows], default=str))
                      except Exception as exc:
                          print('MIRA_HOST_DB_ERROR', sql[:45], type(exc).__name__, str(exc)[:300])
              await engine.dispose()
          asyncio.run(main())
          '@ | & 'C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe' -
          Write-Output '--- OpenAI answer to the Mira Host session settings'
          @'
          import httpx, json
          from app.config import settings
          from app.services import mira_host as h
          session = {
              "type": "realtime", "model": settings.VOICE_ASSISTANT_MODEL, "instructions": "Test.",
              "audio": {
                  "input": {
                      "format": {"type": "audio/pcm", "rate": 24000},
                      "transcription": {"model": "gpt-4o-transcribe", "prompt": "Takim 1H."},
                      "turn_detection": {"type": "semantic_vad", "eagerness": "high", "create_response": True, "interrupt_response": True},
                      "noise_reduction": {"type": "near_field"},
                  },
                  "output": {"format": {"type": "audio/pcm", "rate": 24000}, "voice": settings.MIRA_HOST_VOICE, "speed": settings.MIRA_HOST_SPEED},
              },
              "tools": h.tool_definitions(), "tool_choice": "auto",
          }
          r = httpx.post("https://api.openai.com/v1/realtime/client_secrets", timeout=30,
              headers={"Authorization": f"Bearer {settings.OPENAI_API_KEY}"},
              json={"expires_after": {"anchor": "created_at", "seconds": 60}, "session": session})
          # Only the error is printed; a success would contain a short-lived key.
          print("OPENAI_STATUS", r.status_code, "model", settings.VOICE_ASSISTANT_MODEL, "voice", settings.MIRA_HOST_VOICE)
          print("OPENAI_ERROR", r.text[:1500] if r.is_error else "ok")
          '@ | & 'C:\Users\Administrator\AppData\Local\Programs\Python\Python313\python.exe' -
          Write-Output '--- Mira Host lines from the Discord bot logs'
          Get-ChildItem 'C:\pm2-system\logs\primeflow-discord*' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object {
            Write-Output ('FILE ' + $_.Name + ' ' + $_.LastWriteTime)
            Get-Content -LiteralPath $_.FullName -Tail 20000 | Where-Object {
              ($_ -match 'Mira host|MIRA_HOST|mira-host|mira_host|Traceback|Error|error|failed|Exception') -and ($_ -notmatch 'mira-host/tick')
            } | Select-Object -Last 60
          }
          Write-Output '--- mira-host requests and errors from the API logs'
          Get-ChildItem 'C:\pm2-system\logs\primex-backend*' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output ('FILE ' + $_.Name + ' ' + $_.LastWriteTime)
            Get-Content -LiteralPath $_.FullName -Tail 6000 | Select-String -Pattern 'mira-host|mira_host' -Context 0,25 | Select-Object -Last 6 | ForEach-Object { $_.ToString() }
          }
          Get-ChildItem 'C:\pm2-system\logs\primeflow-discord*' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Tail 2000 | Where-Object {
              $_ -match 'HTTP Request: POST .*voice-meetings/' -or
              $_ -match 'Discord operation failed:' -or
              $_ -match 'MIRA_DIAGNOSTIC'
            } | Select-Object -Last 45
          }
          # Mira's memory register runs in the Celery worker; pm2 names its logs celery-worker-*.
          Get-ChildItem 'C:\pm2-system\logs\celery-worker*' -File -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Tail 4000 | Where-Object { $_ -match 'MIRA_DIAGNOSTIC memory' } | Select-Object -Last 30
          }
